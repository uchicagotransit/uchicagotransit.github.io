<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UChicago Transit</title>
    <link rel="icon" type="image/x-icon" href="sources/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="sources/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="sources/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="sources/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="sources/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="sources/android-chrome-512x512.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background-color: #ffffff;
            padding: 40px 20px 20px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 400;
            margin-bottom: 30px;
            color: #000000;
        }

        .form-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #000000;
        }

        input[type="text"],
        select,
        input[type="date"],
        input[type="time"] {
            width: 100%;
            padding: 16px 18px;
            font-size: 1rem;
            border: 2px solid #d0d0d0;
            border-radius: 10px;
            background-color: #ffffff;
            color: #333333;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        select:focus,
        input[type="date"]:focus,
        input[type="time"]:focus {
            outline: none;
            border-color: #4A90E2;
        }

        input::placeholder,
        select option[value=""] {
            color: #999999;
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23999999' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 20px center;
            background-size: 18px;
            padding-right: 50px;
            color: #333333;
        }

        select:invalid {
            color: #999999;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.6;
        }

        .submit-button {
            display: block;
            margin: 30px auto 30px auto;
            padding: 16px 60px;
            font-size: 1.15rem;
            font-weight: 600;
            color: #ffffff;
            background-color: #4A90E2;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .submit-button:hover {
            background-color: #357ABD;
        }

        .submit-button:active {
            background-color: #2868A8;
        }

        .disclaimer {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 10px;
            padding-top: 25px;
            border-top: 1px solid #e0e0e0;
        }

        .disclaimer a {
            color: #666666;
            text-decoration: none;
            font-size: 0.95rem;
            line-height: 1.5;
            transition: color 0.3s;
        }

        .disclaimer a:hover {
            color: #4A90E2;
        }

        .helper-text {
            font-size: 0.85rem;
            color: #888888;
            margin-top: 3px;
            display: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 40px 20px 30px 20px;
            }

            .container {
                max-width: 100%;
            }

            h1 {
                font-size: 2.5rem;
                margin-bottom: 30px;
            }

            label {
                font-size: 1.2rem;
            }

            input[type="text"],
            select,
            input[type="date"],
            input[type="time"] {
                font-size: 1rem;
                padding: 15px 16px;
            }

            .submit-button {
                padding: 15px 50px;
                font-size: 1.1rem;
                margin-top: 40px;
            }

            .disclaimer {
                margin-top: 20px;
                padding-top: 20px;
            }

            .disclaimer a {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Plan trip</h1>

        <form id="tripForm">
            <div class="form-group">
                <label for="from">From:</label>
                <input type="text" id="from" name="from" placeholder="Enter your address" required>
            </div>

            <div class="form-group">
                <label for="to">To:</label>
                <select id="to" name="to" required>
                    <option value="">Select airport</option>
                    <option value="MDW">MDW - Midway International Airport</option>
                    <option value="ORD">ORD - O'Hare International Airport</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Date:</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="form-group">
                <label for="time">Leaving UChicago at:</label>
                <input type="time" id="time" name="time" placeholder="e.g., 5:30 PM or 17:30" required>
            </div>

            <button type="submit" class="submit-button">Take the train, instead →</button>
        </form>

        <div class="disclaimer">
            <a href="https://transit.rso.uchicago.edu" target="_blank" rel="noopener noreferrer">
                UChicago Transit Enthusiasts & Explorers reminds you that you can also save money going to the airport by taking transit.
            </a>
        </div>
    </div>

    <script>
        document.getElementById('tripForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const from = document.getElementById('from').value;
            const to = document.getElementById('to').value;
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;

            // Encode the origin address
            const encodedFrom = encodeURIComponent(from);

            // Create the destination (airport code with full name)
            let destination = '';
            if (to === 'MDW') {
                destination = 'MDW,+South+Cicero+Avenue,+Chicago,+IL';
            } else if (to === 'ORD') {
                destination = 'ORD,+Chicago,+IL';
            }

            // Combine date and time for departure time parameter
            const departureDateTime = `${date}T${time}:00`;
            const departureTimestamp = Math.floor(new Date(departureDateTime).getTime() / 1000);

            // Debug: log the timestamp
            console.log('Date:', date);
            console.log('Time:', time);
            console.log('DateTime:', departureDateTime);
            console.log('Timestamp:', departureTimestamp);
            console.log('Human readable:', new Date(departureTimestamp * 1000).toString());

            // Construct Google Maps Transit URL with departure time
            // Format: google.com/maps/dir/{origin}/{destination}/data=...!2m3!6e0!7e2!8j{timestamp}!3e3
            // 2m3 - data section with 3 parameters
            // 6e0 - route options
            // 7e2 - depart at specified time (7e3 would be arrive by)
            // 8j{timestamp} - Unix timestamp in seconds
            // 3e3 - transit mode
            const mapsUrl = `https://www.google.com/maps/dir/${encodedFrom}/${destination}/data=!3m1!4e3!4m2!4m1!3e3!2m3!6e0!7e2!8j${departureTimestamp}?entry=ttu`;

            // Debug: log the URL
            console.log('Maps URL:', mapsUrl);

            // Redirect to Google Maps
            window.location.href = mapsUrl;
        });

        // Set minimum date to today
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('date').setAttribute('min', today);
    </script>
</body>
</html>
