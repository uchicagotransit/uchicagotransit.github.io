<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UChicago Transit</title>
    <link rel="icon" type="image/x-icon" href="sources/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="sources/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="sources/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="sources/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="sources/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="sources/android-chrome-512x512.png">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T2D99Y4FXZ"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background-color: #ffffff;
            padding: 40px 20px 20px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 400;
            margin-bottom: 30px;
            color: #000000;
        }

        .form-group {
            margin-bottom: 30px;
        }

        .form-fields {
            display: flex;
            flex-direction: column;
        }

        .field-order-1 {
            order: 1;
        }

        .field-order-2 {
            order: 2;
        }

        label {
            display: block;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #000000;
        }

        input[type="text"],
        select,
        input[type="date"],
        input[type="time"] {
            width: 100%;
            padding: 16px 18px;
            font-size: 1rem;
            border: 2px solid #d0d0d0;
            border-radius: 10px;
            background-color: #ffffff;
            color: #333333;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        select:focus,
        input[type="date"]:focus,
        input[type="time"]:focus {
            outline: none;
            border-color: #4A90E2;
        }

        input::placeholder,
        select option[value=""] {
            color: #999999;
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23999999' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 20px center;
            background-size: 18px;
            padding-right: 50px;
            color: #333333;
        }

        select:invalid {
            color: #999999;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.6;
        }

        .submit-button {
            display: block;
            margin: 30px auto 30px auto;
            padding: 16px 60px;
            font-size: 1.15rem;
            font-weight: 600;
            color: #ffffff;
            background-color: #800020;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .submit-button:hover {
            background-color: #660019;
        }

        .submit-button:active {
            background-color: #4d0013;
        }

        .disclaimer {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 10px;
            padding-top: 25px;
            border-top: 1px solid #e0e0e0;
        }

        .disclaimer a {
            color: #666666;
            text-decoration: none;
            font-size: 0.95rem;
            line-height: 1.5;
            transition: color 0.3s;
        }

        .disclaimer a:hover {
            color: #4A90E2;
        }

        .helper-text {
            font-size: 0.85rem;
            color: #888888;
            margin-top: 3px;
            display: none;
        }

        .direction-group {
            margin-bottom: 30px;
        }

        .radio-options {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .radio-option {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .radio-option input[type="radio"] {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            cursor: pointer;
            accent-color: #4A90E2;
        }

        .radio-option label {
            margin: 0;
            font-size: 1rem;
            font-weight: 400;
            cursor: pointer;
        }

        .callout-box {
            display: none;
            background-color: #800020;
            color: #ffffff;
            padding: 15px 20px;
            border-radius: 10px;
            margin-top: 20px;
            cursor: pointer;
            transition: background-color 0.3s;
            text-decoration: none;
            align-items: center;
            justify-content: space-between;
        }

        .callout-box.visible {
            display: flex;
        }

        .callout-box:hover {
            background-color: #660019;
        }

        .callout-text {
            flex: 1;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .callout-arrow {
            margin-left: 15px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            body {
                padding: 40px 20px 30px 20px;
            }

            .container {
                max-width: 100%;
            }

            h1 {
                font-size: 2.5rem;
                margin-bottom: 30px;
            }

            label {
                font-size: 1.2rem;
            }

            input[type="text"],
            select,
            input[type="date"],
            input[type="time"] {
                font-size: 1rem;
                padding: 15px 16px;
            }

            .submit-button {
                padding: 15px 50px;
                font-size: 1.1rem;
                margin-top: 40px;
            }

            .disclaimer {
                margin-top: 20px;
                padding-top: 20px;
            }

            .disclaimer a {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Plan trip</h1>

        <form id="tripForm">
            <div class="form-group direction-group">
                <label>Direction:</label>
                <div class="radio-options">
                    <div class="radio-option">
                        <input type="radio" id="toAirport" name="direction" value="toAirport" checked>
                        <label for="toAirport">To Airport</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="fromAirport" name="direction" value="fromAirport">
                        <label for="fromAirport">From Airport</label>
                    </div>
                </div>
                <a href="https://transit.rso.uchicago.edu/welcome/#:~:text=Coming%20from%20the%20airport%3F%20Skip%20the%20expensive%20rideshare." target="_blank" rel="noopener noreferrer" class="callout-box" id="calloutBox">
                    <span class="callout-text">Learn more about how transit can give you a cheaper rideshare fare.</span>
                    <span class="callout-arrow">→</span>
                </a>
            </div>

            <div class="form-fields">
                <div class="form-group" id="addressGroup">
                    <label for="address" id="addressLabel">Your Address:</label>
                    <input type="text" id="address" name="address" placeholder="Enter your address" required>
                </div>

                <div class="form-group" id="airportGroup">
                    <label for="airport" id="airportLabel">Airport:</label>
                    <select id="airport" name="airport" required>
                        <option value="">Select airport</option>
                        <option value="MDW">MDW - Midway International Airport</option>
                        <option value="ORD">ORD - O'Hare International Airport</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="submit-button">Take transit, instead →</button>
        </form>

        <div class="disclaimer">
            <a href="https://transit.rso.uchicago.edu" target="_blank" rel="noopener noreferrer">
                UChicagoTransit.com is a parody and not a real service. UChicago Transit Enthusiasts & Explorers RSO reminds you that you can save money going to the airport and around the city by taking transit.
            </a>
        </div>
    </div>

    <script>
        // Update form labels and order based on direction
        function updateFormLabels() {
            const direction = document.querySelector('input[name="direction"]:checked').value;
            const addressLabel = document.getElementById('addressLabel');
            const airportLabel = document.getElementById('airportLabel');
            const addressGroup = document.getElementById('addressGroup');
            const airportGroup = document.getElementById('airportGroup');
            const calloutBox = document.getElementById('calloutBox');

            if (direction === 'toAirport') {
                // Going to airport: Address first, then Airport
                addressLabel.textContent = 'From:';
                airportLabel.textContent = 'To:';
                addressGroup.classList.remove('field-order-2');
                addressGroup.classList.add('field-order-1');
                airportGroup.classList.remove('field-order-1');
                airportGroup.classList.add('field-order-2');
                calloutBox.classList.remove('visible');
            } else {
                // Coming from airport: Airport first, then Address
                addressLabel.textContent = 'To:';
                airportLabel.textContent = 'From:';
                addressGroup.classList.remove('field-order-1');
                addressGroup.classList.add('field-order-2');
                airportGroup.classList.remove('field-order-2');
                airportGroup.classList.add('field-order-1');
                calloutBox.classList.add('visible');
            }
        }

        // Listen for direction changes
        document.querySelectorAll('input[name="direction"]').forEach(radio => {
            radio.addEventListener('change', updateFormLabels);
        });

        document.getElementById('tripForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const direction = document.querySelector('input[name="direction"]:checked').value;
            const addressInput = document.getElementById('address').value;
            const airportCode = document.getElementById('airport').value;

            // Set up origin and destination based on direction
            let origin, destination;

            if (direction === 'toAirport') {
                // Going to airport: from address to airport
                origin = addressInput;
                if (airportCode === 'MDW') {
                    destination = 'Midway Orange Line Station Chicago, IL';
                } else if (airportCode === 'ORD') {
                    destination = "O'Hare Blue Line Station, Chicago, IL";
                }
            } else {
                // Coming from airport: from airport to address
                if (airportCode === 'MDW') {
                    origin = 'Midway Orange Line Station Chicago, IL';
                } else if (airportCode === 'ORD') {
                    origin = "O'Hare Blue Line Station, Chicago, IL";
                }
                destination = addressInput;
            }

            // Construct Google Maps Directions API URL
            const params = new URLSearchParams({
                api: '1',
                origin: origin,
                destination: destination,
                travelmode: 'transit',
                transit_mode: 'rail|bus'
            });

            const mapsUrl = `https://www.google.com/maps/dir/?${params.toString()}`;

            // Redirect to Google Maps
            window.location.href = mapsUrl;
        });

        // Initialize form labels
        updateFormLabels();
    </script>
</body>
</html>
